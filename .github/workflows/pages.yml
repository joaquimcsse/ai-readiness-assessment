# Verifica o núcleo lógico e os critérios de aceitação (V2, CT-01 a CT-08)
# e publica a página estática no GitHub Pages.
name: Testes e publicação

# Os testes rodam também no branch que o GitHub Pages publica hoje
# (mgp-pme-pagina-estatica, modo "a partir de branch"): sem isso, o que vai ao
# ar nunca passava pela suíte (R1 da avaliação do PBL 7).
on:
  push:
    branches: [main, mgp-pme-pagina-estatica]
  pull_request:
  workflow_dispatch:

# Mínimo privilégio: o job de testes só lê; as permissões de publicação ficam
# no job que publica.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar site (somente arquivos da página)
        run: |
          mkdir -p _site
          cp -r index.html dados.json css js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
